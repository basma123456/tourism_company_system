name: Laravel Production Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install PHP dependencies
      - name: Install PHP dependencies
        run: |
          composer install --no-dev --optimize-autoloader

      # Step 3: Upload files via SFTP (SSH on port 21)
      - name: Upload files via SFTP
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ftp.smartv-demo.com
          username: svdemo
          key: ${{ secrets.ID_RSA }}
          port: 21                 # custom SSH/SFTP port
          source: "./"
          target: "public_html/tourism_company/"
          strip_components: 0
          rm: true

      # Step 4: Run remote Laravel commands via SSH
      - name: Run remote commands
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ftp.smartv-demo.com
          username: svdemo
          key: ${{ secrets.ID_RSA }}
          port: 21                 # same SSH/SFTP port
          script: |
            cd public_html/tourism_company
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
