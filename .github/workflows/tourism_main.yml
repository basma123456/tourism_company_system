name: Laravel FTP Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install PHP dependencies locally
      - name: Install PHP dependencies
        run: |
          composer install --no-dev --optimize-autoloader

      # Step 3: Upload files via FTP
      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ftp.smartv-demo.com                  # Your FTP host
          username: svdemo                             # Your FTP username
          password: ${{ secrets.FTP_PASSWORD }}       # FTP password (stored as GitHub secret)
          port: 21                                     # FTP port
          protocol: ftp                                # ftp or ftps
          local-dir: ./                                # Local directory to upload
          server-dir: public_html/tourism_company     # Remote directory on the server
          log-level: info                              # Optional: show info logs

