name: Laravel FTP Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

     

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ftp.smartv-demo.com
          username: tourism
          password: ${{ secrets.TOURISM }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: public_html/tourism_company/
          log-level: verbose
          security: loose
          exclude: .ftpignore

