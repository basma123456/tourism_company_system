name: Deploy via SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: appleboy/sftp-action@v0.1.7
        with:
          host: ftp.smartv-demo.com
          username: tourism
          password: ${{ secrets.ID_RSA }}
          port: 21
          source: "./public"
          target: "public_html/tourism_company/"
          strip_components: 0
          rm: true
