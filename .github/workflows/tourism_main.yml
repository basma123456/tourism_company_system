name: Deploy to cPanel via SFTP (password)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ftp.smartv-demo.com
          username: tourism
          password: ${{ secrets.ID_RSA }}   # store cPanel password in GitHub Secrets
          port: 21
          source: "./public"
          target: "public_html/tourism_company/"
          overwrite: true
          strip_components: 0
