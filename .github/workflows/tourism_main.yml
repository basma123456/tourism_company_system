name: Deploy to cPanel via SFTP (SSH key)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ftp.smartv-demo.com
          username: tourism@smartv-demo.com
          key: ${{ secrets.SFTP_PRIVATE_KEY }}
          source: "./"
          target: "public_html/tourism_company"
          port: 22
