name: Deploy to cPanel via SFTP (SSH key)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ftp.smartv-demo.com
          username: tourism           # your cPanel username
          key: ${{ secrets.ID_RSA }}  # full private key
          port: 2222                  # check your cPanel SSH port
          source: "./"          # folder to deploy
          target: "public_html/tourism_company/"
          overwrite: true
          strip_components: 0
